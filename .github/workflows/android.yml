name: Guitar Book Online

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir www
          cp index.html script.js style.css www/

      - name: Add Android
        run: npx cap add android

      - name: Build APK
  run: |
    cd android
    chmod +x gradlew
    ./gradlew assembleDebug --stacktrace --info 2>&1 | tee ../build.log
    exit ${PIPESTATUS[0]}

- name: Upload build log
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: Build-Log
    path: build.log


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Book-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
